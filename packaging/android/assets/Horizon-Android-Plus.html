/* Responsive landscape and portrait support */
@media (orientation: landscape) and (max-height: 600px) {
  :root { --sidebar: 205px; }
  .sidebar { width: var(--sidebar); }
  .main { margin-left: var(--sidebar); }
  .sidebar-inner { padding-top: 12px; padding-bottom: 12px; }
  .brand { min-height: 58px; }
  .nav-group { margin-top: 12px; }
  .nav-link { min-height: 36px; padding-top: 8px; padding-bottom: 8px; }
  .topbar { height: 54px; }
  .content { padding: 18px 24px 26px; }
  .page-head { margin-bottom: 14px; }
  .hero { min-height: 220px; padding: 20px 24px; }
  .hero h2 { font-size: clamp(22px, 3.5vw, 32px); }
  .hero-world { max-height: 220px; }
  .horizon-launch-screen { min-height: calc(100svh - 75px); padding-top: 12px; padding-bottom: 12px; }
  .first-run-panel { width: min(900px, 100%); max-height: calc(100svh - 16px); padding: 16px 20px; }
  .first-run-logo { width: min(340px, 42vw); max-height: 72px; object-fit: contain; margin-bottom: 8px; }
  .first-run-panel h1 { font-size: 21px; margin: 5px 0; }
  .first-run-panel > p { margin-bottom: 10px; }
  .setup-version-row { margin: 10px 0; padding: 8px 12px; }
  .setup-details { grid-template-columns: repeat(3, minmax(0,1fr)); margin: 9px 0; }
  .setup-log { height: 90px; }
  .setup-log-panel { margin: 9px 0; }
  .first-run-progress-wrap { margin: 10px 0; }
  .mobile-menu { display: none; }
}
@media (orientation: landscape) and (max-height: 600px) and (max-width: 900px) {
  :root { --sidebar: 68px; }
  .sidebar { width: var(--sidebar); }
  .main { margin-left: var(--sidebar); }
  .brand-name, .nav-group-title, .nav-link span, .sidebar-footer .account-copy { display: none; }
  .brand { justify-content: center; padding: 10px 4px; }
  .brand-logo { max-width: 42px; }
  .nav-link { justify-content: center; padding: 10px 4px; }
  .sidebar-footer { justify-content: center; }
  .sidebar-footer .account-avatar { margin: 0; }
  .content { padding: 14px 16px 20px; }
  .grid.four, .content-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .hero { min-height: 190px; }
}
@media (orientation: portrait) {
  .content { min-width: 0; }
  .main, .app-shell { min-width: 0; }
  img, svg, canvas { max-width: 100%; }
}
@media (max-width: 760px) and (orientation: portrait) {
  .mobile-menu { display: grid; }
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; }
}


/* Responsive navigation fix */
.sidebar{
  box-sizing:border-box;
  height:100vh;
  height:100dvh;
  overflow-x:hidden;
  overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;
  scrollbar-color:var(--surface-3) transparent;
}
.sidebar-spacer{flex:0 0 14px;min-height:14px}
.sidebar-bottom{flex:0 0 auto;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.nav-label,.nav-list,.sidebar-card,.brand{flex-shrink:0}
.mobile-overlay{z-index:19;touch-action:pan-y}
@media (max-width:900px), (max-height:560px) and (pointer:coarse){
  :root{--sidebar:min(290px,82vw)}
  .sidebar{
    position:fixed;top:0;bottom:0;left:0;
    width:var(--sidebar);height:100vh;height:100dvh;
    padding-top:max(18px,env(safe-area-inset-top));
    padding-bottom:max(14px,env(safe-area-inset-bottom));
    overflow-y:auto;overscroll-behavior-y:contain;
    transform:translateX(-105%);
    transition:transform .24s ease;
    z-index:30;
  }
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .mobile-menu{display:grid!important;place-items:center}
  .mobile-overlay.show{display:block;position:fixed;inset:0;z-index:25}
  .topbar{padding-left:12px;padding-right:12px}
}
@media (orientation:landscape) and (max-height:560px) and (pointer:coarse){
  .sidebar{padding-top:8px;padding-bottom:8px}
  .brand{padding-bottom:12px}
  .nav-label{padding-top:8px;padding-bottom:5px}
  .nav-item{height:38px}
  .sidebar-card{margin-top:6px;margin-bottom:8px;padding:9px}
  .sidebar-bottom{padding-top:8px}
  .content{padding-top:18px;padding-bottom:22px}
}

.brand{width:100%;min-width:0;padding:8px 6px 24px;justify-content:flex-start}

/* Smooth page-entry transition when switching launcher menus */
@keyframes horizonPageEnter {
  from { opacity:0; transform:translate3d(0,12px,0) scale(.995); filter:blur(2px); }
  to { opacity:1; transform:translate3d(0,0,0) scale(1); filter:blur(0); }
}
.content.page-enter { animation:horizonPageEnter 340ms cubic-bezier(.2,.72,.25,1) both; transform-origin:50% 12%; }
@media (prefers-reduced-motion: reduce) {
  .content.page-enter { animation:none; }
}

function translateLanguageValue(value,dict){
 const trimmed=value.trim();
 if(Object.prototype.hasOwnProperty.call(dict,trimmed))return value.replace(trimmed,dict[trimmed]);
 let translated=value;
 const keys=Object.keys(dict).filter(key=>key.includes(' ')||key.includes('·')||key.endsWith(':')||key.endsWith(',')||key.length>=28).sort((a,b)=>b.length-a.length);
 for(const key of keys)if(translated.includes(key))translated=translated.split(key).join(dict[key]);
 return translated;
}
const languageTextSources=new WeakMap();
const languageAttributeSources=new WeakMap();
function translateLanguageNode(root,dict){
 if(!root)return;
 const translateTextNode=node=>{
  if(node.parentElement?.closest('script,style'))return;
  const current=node.nodeValue,cached=languageTextSources.get(node);
  const source=cached&&current===cached.rendered?cached.source:current;
  const translated=translateLanguageValue(source,dict);
  languageTextSources.set(node,{source,rendered:translated});
  if(translated!==current)node.nodeValue=translated;
 };
 if(root.nodeType===Node.TEXT_NODE){translateTextNode(root);return}
 if(root.nodeType!==Node.ELEMENT_NODE&&root.nodeType!==Node.DOCUMENT_FRAGMENT_NODE)return;
 if(root.nodeType===Node.ELEMENT_NODE&&['SCRIPT','STYLE'].includes(root.tagName))return;
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 let node;while(node=walker.nextNode())translateTextNode(node);
 const selector='[placeholder],[title],[aria-label],[alt]';
 const elements=[];
 if(root.nodeType===Node.ELEMENT_NODE&&root.matches(selector))elements.push(root);
 if(root.querySelectorAll)elements.push(...root.querySelectorAll(selector));
 for(const element of elements){
  const cached=languageAttributeSources.get(element)||{};
  for(const attr of ['placeholder','title','aria-label','alt'])if(element.hasAttribute(attr)){
   const current=element.getAttribute(attr),entry=cached[attr];
   const source=entry&&current===entry.rendered?entry.source:current;
   const translated=translateLanguageValue(source,dict);
   cached[attr]={source,rendered:translated};
   if(translated!==current)element.setAttribute(attr,translated);
  }
  languageAttributeSources.set(element,cached);
 }
}

}

 const lang=state.settings.language==='Bahasa Indonesia'?'Bahasa Indonesia':'English';
 const dict=UI_TRANSLATIONS[lang];

});

function downloadPagination(category,currentPage,totalPages,itemCount){
 const pageSize=8;
 const start=itemCount?(currentPage-1)*pageSize+1:0;
 const end=itemCount?Math.min(currentPage*pageSize,itemCount):0;
 const button=(page,label,extra='',ariaLabel=label)=>`<button type="button" class="pagination-btn ${extra}" data-action="download-page" data-category="${category}" data-page="${page}" ${page===currentPage?'aria-current="page"':''} ${page<1||page>totalPages?'disabled':''} aria-label="${ariaLabel}">${label}</button>`;
 let visiblePages=[];
 if(totalPages<=5){visiblePages=Array.from({length:totalPages},(_,i)=>i+1);}
 else if(currentPage<=3){visiblePages=[1,2,3];}
 else if(currentPage>=totalPages-2){visiblePages=[totalPages-2,totalPages-1,totalPages];}
 else{visiblePages=[currentPage-1,currentPage,currentPage+1];}
 const showJump=totalPages>5;
 const showFirst=showJump&&currentPage>3;
 const showLast=showJump&&currentPage<totalPages-2;
 const firstButton=showFirst?button(1,'1','', 'Page 1'):'';
 const numberButtons=visiblePages.map(page=>button(page,String(page),page===currentPage?'is-current':'',`Page ${page}${page===currentPage?', current page':''}`)).join('');
 const jumpBox=showJump?`<label class="download-pagination-jump" title="Jump directly to a page"><input type="number" min="1" max="${totalPages}" step="1" inputmode="numeric" placeholder="…" aria-label="Jump to page 1 through ${totalPages}" data-download-jump="${category}"></label>`:'';
 const lastButton=showLast?button(totalPages,String(totalPages),'pagination-last',`Last page, ${totalPages}`):'';
 return `<nav class="download-pagination" aria-label="${category} result pages">
  <div class="download-pagination-meta"><span class="download-pagination-count">${start}–${end} of ${itemCount}</span><span class="download-pagination-separator" aria-hidden="true">|</span><span class="download-pagination-position">${currentPage}/${totalPages}</span></div>
  <div class="pagination-controls">
   ${button(currentPage-1,'Pre','pagination-nav','Previous page')}
   <div class="pagination-pages">${firstButton}${numberButtons}${jumpBox}${lastButton}</div>
   ${button(currentPage+1,'Next','pagination-nav','Next page')}
  </div>
 </nav>`;
}

 const maxPage=Math.max(1,Math.ceil((Number(state.downloadTotalHits)||state.downloadResults.length)/8));
 const page=Math.min(maxPage,Math.max(1,Number(raw)));
 state.downloadPages=state.downloadPages||{resourcepacks:1,shaders:1};

async function fetchModrinthBatch(cat,q,offset=0){
 const projectType=cat==='resourcepacks'?'resourcepack':'shader';
 const facets=JSON.stringify([['project_type:'+projectType]]);
 const params=new URLSearchParams({facets,index:'downloads',limit:'100',offset:String(offset)});
 if(q)params.set('query',q);
 const res=await fetch('https://api.modrinth.com/v2/search?'+params.toString(),{headers:{'Accept':'application/json'}});
 if(!res.ok)throw new Error('Modrinth returned HTTP '+res.status);
 const data=await res.json(),hits=data.hits||[];
 const latestIds=[...new Set(hits.map(x=>x.latest_version).filter(Boolean))];
 const versionsById=new Map();
 if(latestIds.length){
  const versionUrl='https://api.modrinth.com/v2/versions?ids='+encodeURIComponent(JSON.stringify(latestIds));
  const versionRes=await fetch(versionUrl,{headers:{'Accept':'application/json'}});
  if(versionRes.ok){const versionRows=await versionRes.json();for(const version of versionRows)versionsById.set(version.id,version);}
 }
 return {totalHits:Number(data.total_hits)||0,offset,results:hits.map(x=>{
  const version=versionsById.get(x.latest_version),file=version?.files?.find(f=>f.primary)||version?.files?.[0];
  return {id:x.project_id,title:x.title,description:x.description,author:x.author,downloads:x.downloads,projectUrl:'https://modrinth.com/'+projectType+'/'+x.slug,imageUrl:x.icon_url||'',downloadUrl:file?.url||'',filename:file?.filename||'',size:typeof file?.size==='number'?file.size:null,version:version?.version_number||'',provider:'modrinth'};
 })};
}
async function loadDownloadPage(category,page){
 const pageSize=8,batchSize=100,start=(page-1)*pageSize;
 if(start<state.downloadResults.length&&state.downloadResults.slice(start,start+pageSize).every(Boolean))return;
 const offset=Math.floor(start/batchSize)*batchSize;
 if(state.downloadLoadedOffsets?.[category]?.includes(offset))return;
 state.downloadBusy=true;state.downloadMessage='';render();
 try{
  const batch=await fetchModrinthBatch(category,state.downloadQuery||'',offset);
  state.downloadResults=state.downloadResults||[];
  batch.results.forEach((item,i)=>{state.downloadResults[offset+i]=item;});
  state.downloadTotalHits=batch.totalHits;
  state.downloadLoadedOffsets=state.downloadLoadedOffsets||{};
  state.downloadLoadedOffsets[category]=state.downloadLoadedOffsets[category]||[];
  if(!state.downloadLoadedOffsets[category].includes(offset))state.downloadLoadedOffsets[category].push(offset);
 }catch(err){state.downloadMessage=err.message||'Could not load this result page.';}
 finally{state.downloadBusy=false;render();}
}

  if(operation&&Number.isFinite(Number(operation.id))&&Number(operation.id)>state.nativeOperationId){

const HORIZON_RELEASE_CACHE_KEY='horizon-public-release-cache-v1';
const HORIZON_RELEASE_CACHE_TTL=30*60*1000;
let horizonReleaseCheckStarted=false;
function parseHorizonVersion(value){
 const match=String(value||'').trim().replace(/^v/i,'').match(/^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$/);
 if(!match)return null;
 return {major:Number(match[1]),minor:Number(match[2]),patch:Number(match[3]),pre:match[4]||''};
}
function compareHorizonVersions(left,right){
 const a=parseHorizonVersion(left),b=parseHorizonVersion(right);
 if(!a||!b)return null;
 for(const key of ['major','minor','patch'])if(a[key]!==b[key])return a[key]>b[key]?1:-1;
 if(!a.pre&&!b.pre)return 0;
 if(!a.pre)return 1;
 if(!b.pre)return -1;
 const aa=a.pre.split('.'),bb=b.pre.split('.');
 for(let i=0;i<Math.max(aa.length,bb.length);i++){
  if(aa[i]===undefined)return -1;
  if(bb[i]===undefined)return 1;
  if(aa[i]===bb[i])continue;
  const an=/^\d+$/.test(aa[i]),bn=/^\d+$/.test(bb[i]);
  if(an&&bn)return Number(aa[i])>Number(bb[i])?1:-1;
  if(an!==bn)return an?-1:1;
  return aa[i].localeCompare(bb[i]);
 }
 return 0;
}
function showHorizonReleaseUpdate(release,installedVersion){
 if(!release||!release.version)return;
 const comparison=compareHorizonVersions(release.version,installedVersion);
 if(comparison===null||comparison<=0)return;
 const notes=String(release.body||'').trim().slice(0,2400);
 const releaseType=release.prerelease?'Pre-release':'Public release';
 const body=`<div class="notice"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><strong>${escapeHtml(release.name||release.tag||'Horizon Android + update')}</strong><span class="pill purple">${releaseType}</span></div><div class="home-status-row"><span>Installed version</span><strong>${escapeHtml(installedVersion)}</strong></div><div class="home-status-row"><span>Latest version</span><strong>${escapeHtml(release.version)}</strong></div>${notes?`<div class="divider"></div><strong>Release notes</strong><p style="white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0 0">${escapeHtml(notes)}</p>`:'<p style="margin:8px 0 0">A newer APK is available on GitHub.</p>'}</div>`;
 const footer=`<button class="btn" data-action="close-modal">Later</button><a class="btn primary" href="${escapeAttr(release.url||'https://github.com/CihuyAkz/horizon-android-plus/releases')}">View release</a>`;
 if(!state.modal)openModal('Update available','A newer Horizon Android + build has been published.',body,footer);
}
window.onHorizonReleaseResult=function(payload){
 let result=null;
 try{result=JSON.parse(String(payload||'{}'));}catch(error){result=null;}
 let cached=null;
 try{cached=JSON.parse(localStorage.getItem(HORIZON_RELEASE_CACHE_KEY)||'null');}catch(error){}
 if(result?.checked===true){
  cached={checkedAt:Date.now(),release:result.release||null};
  try{localStorage.setItem(HORIZON_RELEASE_CACHE_KEY,JSON.stringify(cached));}catch(error){}
 }
 const installedVersion=(()=>{try{return String(window.HorizonAndroid.appVersion()||'').trim();}catch(error){return '';}})();
 if(!installedVersion)return;
 const release=result?.release||cached?.release||null;
 if(release)showHorizonReleaseUpdate(release,installedVersion);
};
function checkHorizonReleaseUpdate(){
 if(horizonReleaseCheckStarted||!hasNativeBridge()||typeof window.HorizonAndroid.appVersion!=='function'||typeof window.HorizonAndroid.checkLatestRelease!=='function')return;
 horizonReleaseCheckStarted=true;
 let installedVersion='';
 try{installedVersion=String(window.HorizonAndroid.appVersion()||'').trim();}catch(error){}
 if(!installedVersion)return;
 let cached=null;
 try{cached=JSON.parse(localStorage.getItem(HORIZON_RELEASE_CACHE_KEY)||'null');}catch(error){}
 if(cached?.checkedAt&&Date.now()-Number(cached.checkedAt)<HORIZON_RELEASE_CACHE_TTL){
  if(cached.release)showHorizonReleaseUpdate(cached.release,installedVersion);
  return;
 }
 try{window.HorizonAndroid.checkLatestRelease();}catch(error){console.debug('Horizon release check unavailable:',error);}
}

if(hasNativeBridge()){
 refreshNativeStatus();
 setInterval(refreshNativeStatus,900);
 setTimeout(checkHorizonReleaseUpdate,1200);
}

render();
startHorizonIntro();
