
name: Clean Repository Except GitHub

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clean-repository-${{ github.ref }}
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Delete all items except .github
        shell: bash
        run: |
          set -euo pipefail

          echo "Menghapus seluruh isi repository kecuali .github..."

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".github" \
            -exec rm -rf -- {} +

          echo "Pembersihan selesai."

          echo "Isi repository yang tersisa:"
          ls -la

      - name: Commit and Push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Clean repository except .github"

          TARGET_BRANCH="$GITHUB_REF_NAME"

          echo "Push ke branch: $TARGET_BRANCH"

          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

          echo "Push berhasil!"
