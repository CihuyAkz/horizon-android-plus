
name: Extract ZIP and Flatten

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extract-zip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Find ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Tidak ada file ZIP."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/extracted
          mkdir -p /tmp/extracted
          unzip -q "$ZIP_FILE" -d /tmp/extracted

      - name: Find source root
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="/tmp/extracted"

          while true; do
            entries=()
            while IFS= read -r -d '' item; do
              entries+=("$item")
            done < <(
              find "$CURRENT" -mindepth 1 -maxdepth 1 \
                ! -name ".github" -print0
            )

            if [ "${#entries[@]}" -ne 1 ]; then
              break
            fi

            item="${entries[0]}"
            if [ ! -d "$item" ]; then
              break
            fi

            CURRENT="$item"
          done

          if [ -z "$(find "$CURRENT" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
            echo "ERROR: ZIP kosong."
            exit 1
          fi

          rm -rf /tmp/final
          mkdir -p /tmp/final
          cp -a "$CURRENT"/. /tmp/final/

      - name: Merge extracted files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/final/.github
          rsync -av --exclude='/.github/' /tmp/final/ ./

      - name: Remove source ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$ZIP_FILE"

      - name: Commit and Push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Add or update source from ZIP"

          TARGET_BRANCH="$GITHUB_REF_NAME"

          echo "Push ke branch: $TARGET_BRANCH"

          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

          echo "Push berhasil!"
