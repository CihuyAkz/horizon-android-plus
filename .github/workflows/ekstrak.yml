
name: Extract ZIP and Flatten

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extract-zip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Find ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' ZIP_FILES < <(
            find . -maxdepth 1 -type f -iname "*.zip" -print0 | sort -z
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "ERROR: Tidak ada file ZIP."
            exit 1
          fi

          echo "Ditemukan ${#ZIP_FILES[@]} file ZIP:"
          printf ' - %s\n' "${ZIP_FILES[@]}"

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/extracted /tmp/final
          mkdir -p /tmp/extracted /tmp/final

          mapfile -d '' ZIP_FILES < <(
            find . -maxdepth 1 -type f -iname "*.zip" -print0 | sort -z
          )

          INDEX=0

          for ZIP_FILE in "${ZIP_FILES[@]}"; do
            INDEX=$((INDEX + 1))

            echo "=================================="
            echo "Extracting: $ZIP_FILE"
            echo "=================================="

            if ! unzip -t "$ZIP_FILE"; then
              echo "ERROR: File ZIP rusak atau tidak valid: $ZIP_FILE"
              exit 1
            fi

            CURRENT_EXTRACT="/tmp/extracted/$INDEX"

            mkdir -p "$CURRENT_EXTRACT"

            unzip -q "$ZIP_FILE" -d "$CURRENT_EXTRACT"

            CURRENT="$CURRENT_EXTRACT"

            while true; do
              entries=()

              while IFS= read -r -d '' item; do
                entries+=("$item")
              done < <(
                find "$CURRENT" -mindepth 1 -maxdepth 1 \
                  ! -name ".github" -print0
              )

              if [ "${#entries[@]}" -ne 1 ]; then
                break
              fi

              item="${entries[0]}"

              if [ ! -d "$item" ]; then
                break
              fi

              CURRENT="$item"
            done

            if [ -z "$(find "$CURRENT" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
              echo "ERROR: ZIP kosong: $ZIP_FILE"
              exit 1
            fi

            echo "Merging contents from: $ZIP_FILE"

            rsync -av "$CURRENT/" /tmp/final/

          done

          echo "=================================="
          echo "Semua ZIP berhasil diekstrak."
          echo "=================================="

      - name: Merge extracted files
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/final/.github
          rsync -av --exclude='/.github/' /tmp/final/ ./

      - name: Remove source ZIP
        shell: bash
        run: |
          set -euo pipefail

          find . -maxdepth 1 -type f -iname "*.zip" -delete

          echo "Semua file ZIP sumber berhasil dihapus."

      - name: Commit and Push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Add or update source from ZIP"

          TARGET_BRANCH="$GITHUB_REF_NAME"

          echo "Push ke branch: $TARGET_BRANCH"

          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

          echo "Push berhasil!"
